{% extends "base.html" %}
{% block title %}Log in - ClinicCare-Lite{% endblock %}
{% block content %}
<div class="auth-wrap card">
  <h1>Log in</h1>
  <p class="muted small">Clinic Patient Administration &amp; Communication System</p>
  <form method="post">
    <label for="user_id">User ID (8 digits)</label>
    <input id="user_id" name="user_id" inputmode="numeric" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" name="password" autocomplete="current-password" required>
    <div style="margin-top:16px"><button class="btn" type="submit">Log in</button></div>
  </form>
  <p class="small muted" style="margin-top:14px">
    No account? <a href="{{ url_for('register') }}">Register</a>.
  </p>
  <p class="small muted">
    Demo: clinician <code>10000000</code> / patient <code>20142024</code> — password <code>Clinic@2026</code>
  </p>
</div>
{% endblock %}
